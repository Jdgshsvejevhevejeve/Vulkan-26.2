name: Build Vulkan 26.2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Plugin
        run: gradle clean build

      - name: Upload Vulkan JAR
        uses: actions/upload-artifact@v4
        with:
          name: Vulkan-26.2
          path: build/libs/Vulkan-26.2.jar
